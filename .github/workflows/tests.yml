name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile app.py tastetrail/qloo.py tastetrail/core.py scripts/verify_hackathon_api.py

